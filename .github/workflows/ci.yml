name: SStudio v3 CI & Auto-Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Python 3.12 o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutubxonalarni o'rnatish
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install email-validator

      - name: Testlarni ishga tushirish
        run: |
          python -m unittest discover tests -v

  deploy:
    name: Deploy to VPS (/root/app/v3)
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Setup SSH (v2 usuli - Base64)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to Ubuntu Server
        run: |
          ssh root@${{ secrets.SERVER_IP }} 'bash -se' << 'EOF'
            set -e
            echo "=== VPS ga ulandik! SStudio v3 o'rnatilmoqda ==="

            # 1. Papka tekshirish
            if [ ! -d "/root/app/v3" ]; then
                echo "Papka topilmadi. Repozitoriya klon qilinmoqda..."
                mkdir -p /root/app
                cd /root/app
                git clone https://github.com/sardorbek-200/sstudio-v3.git v3
                cd /root/app/v3
                chmod +x infra/setup-vps.sh
                bash infra/setup-vps.sh
            else
                cd /root/app/v3
                echo "Yangi kod tortilmoqda (git pull)..."
                git pull origin main
            fi

            # 2. Virtual muhit va kutubxonalar
            if [ ! -d "/root/app/v3/.venv" ]; then
                echo "Python venv yaratilmoqda..."
                python3 -m venv /root/app/v3/.venv
            fi

            echo "Kutubxonalar tekshirilmoqda..."
            /root/app/v3/.venv/bin/pip install --upgrade pip
            /root/app/v3/.venv/bin/pip install -r /root/app/v3/requirements.txt
            /root/app/v3/.venv/bin/pip install email-validator

            # 3. Systemd va Nginx ni yangilash
            echo "Xizmatlar yangilanmoqda..."
            cp /root/app/v3/infra/systemd/*.service /etc/systemd/system/ 2>/dev/null || true
            systemctl daemon-reload
            systemctl restart sstudio-auth 2>/dev/null || true

            cp /root/app/v3/infra/nginx/*.conf /etc/nginx/conf.d/ 2>/dev/null || true
            nginx -t && systemctl reload nginx 2>/dev/null || true

            echo "=== SStudio v3: Deploy to'liq va muvaffaqiyatli yakunlandi! ==="
          EOF
