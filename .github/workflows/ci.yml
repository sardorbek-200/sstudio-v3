name: SStudio v3 CI & Auto-Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Python 3.12 o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutubxonalarni o'rnatish
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install email-validator

      - name: Testlarni ishga tushirish
        run: |
          python -m unittest discover tests -v

  deploy:
    name: Deploy to VPS (/root/app/v3)
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: VPS ga SSH orqali ulanish va avto-o'rnatish
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "=== SStudio v3 Avto-Deploy Boshlandi ==="

            # 1. Agar papka mavjud bo'lmasa, klon qilamiz
            if [ ! -d "/root/app/v3" ]; then
                echo "Papka topilmadi. Repozitoriya klon qilinmoqda..."
                mkdir -p /root/app
                cd /root/app
                git clone https://github.com/sardorbek-200/sstudio-v3.git v3
                cd /root/app/v3
                chmod +x infra/setup-vps.sh
                bash infra/setup-vps.sh
            else
                # 2. Mavjud bo'lsa, yangilanishlarni tortamiz
                cd /root/app/v3
                git pull origin main
            fi

            # 3. Virtual muhit va kutubxonalar
            if [ ! -d "/root/app/v3/.venv" ]; then
                python3 -m venv /root/app/v3/.venv
            fi
            /root/app/v3/.venv/bin/pip install --upgrade pip
            /root/app/v3/.venv/bin/pip install -r /root/app/v3/requirements.txt
            /root/app/v3/.venv/bin/pip install email-validator

            # 4. Baza migratsiyasi
            if [ -f "/root/app/v3/.env" ]; then
                /root/app/v3/.venv/bin/python -m alembic upgrade head || true
            fi

            # 5. Systemd va Nginx qayta ishga tushirish
            cp /root/app/v3/infra/systemd/*.service /etc/systemd/system/ 2>/dev/null || true
            systemctl daemon-reload
            systemctl restart sstudio-auth 2>/dev/null || true

            cp /root/app/v3/infra/nginx/*.conf /etc/nginx/conf.d/ 2>/dev/null || true
            nginx -t && systemctl reload nginx 2>/dev/null || true

            echo "=== SStudio v3: Deploy muvaffaqiyatli yakunlandi! ==="
