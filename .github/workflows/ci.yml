name: SStudio v3 CI & Auto-Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Python 3.12 o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutubxonalarni o'rnatish
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install email-validator

      - name: Testlarni ishga tushirish
        run: |
          python -m unittest discover tests -v

  deploy:
    name: Deploy to VPS (/root/app/v3)
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      TARGET_HOST: ${{ secrets.SERVER_IP || secrets.VPS_HOST }}
      TARGET_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY }}
    steps:
      - name: Setup SSH (v2 usuli - Base64)
        run: |
          mkdir -p ~/.ssh
          echo "$TARGET_KEY" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$TARGET_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to Ubuntu Server (Nginx ga tegilmaydi!)
        run: |
          ssh root@"$TARGET_HOST" 'bash -se' << 'EOF'
            set -e
            echo "=== VPS ga ulandik! SStudio v3 yangilanmoqda ==="

            cd /root/app/v3
            echo "Yangi kod tortilmoqda (toza reset)..."
            git fetch origin main
            git reset --hard origin/main

            # Virtual muhit va kutubxonalarni yangilash
            echo "Kutubxonalar tekshirilmoqda..."
            /root/app/v3/.venv/bin/pip install -r /root/app/v3/requirements.txt

            # Baza migratsiyasi
            if [ -f "/root/app/v3/.env" ]; then
                /root/app/v3/.venv/bin/python -m alembic upgrade head || true
            fi

            # Systemd servislarni yangilash va qayta ishga tushirish (Nginx ga tegilmaydi!)
            cp /root/app/v3/infra/systemd/*.service /etc/systemd/system/ 2>/dev/null || true
            systemctl daemon-reload
            systemctl enable sstudio-auth sstudio-main sstudio-quizer 2>/dev/null || true
            systemctl restart sstudio-auth sstudio-main sstudio-quizer 2>/dev/null || true

            echo "=== SStudio v3: Deploy to'liq va xavfsiz yakunlandi! ==="
          EOF
