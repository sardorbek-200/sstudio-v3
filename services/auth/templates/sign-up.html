<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SStudio — Kiber Ro'yxatdan O'tish</title>
    
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <style>
        :root {
            --bg-cosmic: #050814;
            --glass-card: rgba(13, 19, 42, 0.78);
            --glass-border: rgba(99, 102, 241, 0.3);
            --glass-border-focus: rgba(0, 242, 254, 0.65);
            --neon-cyan: #00f2fe;
            --neon-violet: #6366f1;
            --neon-purple: #a855f7;
            --neon-emerald: #10b981;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Plus Jakarta Sans", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Dark Autofill Fix - Oq dog'larni butunlay yo'q qilish */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus,
        select:-webkit-autofill {
            -webkit-text-fill-color: #ffffff !important;
            -webkit-box-shadow: 0 0 0px 1000px #090e24 inset !important;
            transition: background-color 5000s ease-in-out 0s !important;
            caret-color: var(--neon-cyan) !important;
        }

        body {
            background-color: var(--bg-cosmic);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* Kosmik Nurlar */
        body::before {
            content: '';
            position: fixed;
            top: -15%;
            left: 20%;
            width: 60vw;
            height: 60vw;
            max-width: 700px;
            max-height: 700px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.16) 0%, rgba(0, 242, 254, 0.08) 40%, transparent 70%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -10%;
            right: 15%;
            width: 50vw;
            height: 50vw;
            max-width: 600px;
            max-height: 600px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.14) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(85px);
            z-index: -1;
            pointer-events: none;
        }

        .auth-container {
            width: 100%;
            max-width: 520px;
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 38px 32px;
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 30px rgba(99, 102, 241, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.14);
            position: relative;
            z-index: 10;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 26px;
        }

        .brand-link {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            margin-bottom: 14px;
        }

        .brand-emblem {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.6));
            transition: transform 0.3s ease;
        }

        .brand-link:hover .brand-emblem {
            transform: scale(1.08) rotate(4deg);
        }

        .auth-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 40%, var(--neon-cyan) 80%, var(--neon-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .auth-subtitle {
            font-size: 13px;
            color: var(--text-dim);
        }

        /* 2-Bosqichli Stepper */
        .stepper-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 26px;
        }

        .step-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-dim);
            transition: all 0.3s ease;
        }

        .step-pill.active {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--neon-cyan);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.25);
        }

        .step-num {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        .step-pill.active .step-num {
            background: var(--neon-cyan);
            color: #050814;
            font-weight: 900;
        }

        /* Forma Maydonlari */
        .step-content {
            display: none;
        }

        .step-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .input-group {
            margin-bottom: 16px;
            position: relative;
        }

        .input-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dim);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .cyber-input {
            width: 100%;
            padding: 12px 14px;
            background: #090e24;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            outline: none;
            transition: all 0.25s ease;
        }

        .cyber-input:focus {
            border-color: var(--glass-border-focus);
            box-shadow: 0 0 18px rgba(0, 242, 254, 0.25);
        }

        .toggle-password-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .toggle-password-btn:hover {
            color: var(--neon-cyan);
        }

        /* Yuridik Shartlar Checkbox */
        .terms-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 18px 0;
            font-size: 12px;
            color: var(--text-dim);
            line-height: 1.5;
        }

        .terms-row input[type="checkbox"] {
            margin-top: 3px;
            accent-color: var(--neon-cyan);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .terms-row a {
            color: var(--neon-cyan);
            text-decoration: underline;
        }

        /* Tugmalar */
        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 22px;
        }

        .btn-cyber-submit {
            flex: 1;
            padding: 14px;
            background: linear-gradient(135deg, var(--neon-violet), var(--neon-purple));
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.4);
            transition: all 0.25s ease;
        }

        .btn-cyber-submit:hover {
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.6);
            transform: translateY(-2px);
        }

        .btn-cyber-back {
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-dim);
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-cyber-back:hover {
            color: #ffffff;
            border-color: var(--neon-cyan);
        }

        /* Ijtimoiy Tarmoqlar */
        .social-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0 18px;
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .social-divider::before, .social-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .social-divider span {
            padding: 0 10px;
        }

        .oauth-cluster {
            display: flex;
            gap: 12px;
        }

        .oauth-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            transition: all 0.2s;
        }

        .oauth-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--neon-cyan);
            color: #ffffff;
        }

        /* Alert Xabarlar */
        .error-alert-box {
            padding: 12px 16px;
            border-radius: 12px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            font-size: 13px;
            margin-bottom: 18px;
            display: none;
        }

        .auth-footer {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: var(--text-dim);
        }

        .auth-footer a {
            color: var(--neon-cyan);
            text-decoration: none;
            font-weight: 700;
        }

        @media (max-width: 480px) {
            .auth-container { padding: 28px 20px; }
            .form-grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <a href="https://{{ domain }}" class="brand-link">
                <img src="/favicon.png" alt="SStudio Logo" class="brand-emblem">
            </a>
            <h1 class="auth-title">Ro'yxatdan O'tish</h1>
            <p class="auth-subtitle">SStudio yangi avlod kiber-shaxsiyatingizni yarating</p>
        </div>

        <!-- Stepper -->
        <div class="stepper-nav">
            <div class="step-pill active" id="step-pill-1">
                <span class="step-num">1</span>
                <span>Asosiy Kirish</span>
            </div>
            <div class="step-pill" id="step-pill-2">
                <span class="step-num">2</span>
                <span>Maktab & Hudud</span>
            </div>
        </div>

        <!-- Xatolik Xabari -->
        <div id="error-alert" class="error-alert-box"></div>

        <form id="cyber-reg-form">

            <!-- 1-BOSQICH: Asosiy Login Ma'lumotlari -->
            <div class="step-content active" id="step-1">
                <div class="form-grid-2">
                    <div class="input-group">
                        <label class="input-label">Ism *</label>
                        <input type="text" id="name" class="cyber-input" placeholder="Sardor" required>
                    </div>
                    <div class="input-group">
                        <label class="input-label">Familiya *</label>
                        <input type="text" id="surname" class="cyber-input" placeholder="Karimov" required>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">Username (Foydalanuvchi nomi) *</label>
                    <input type="text" id="username" class="cyber-input" placeholder="sardor_cyber" required minlength="3">
                </div>

                <div class="input-group">
                    <label class="input-label">Parol *</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="cyber-input" placeholder="Kamida 6 ta belgi" required minlength="6">
                        <button type="button" class="toggle-password-btn" onclick="togglePass('password')">👁️</button>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">Parolni tasdiqlang *</label>
                    <div class="input-wrapper">
                        <input type="password" id="password_confirm" class="cyber-input" placeholder="Parolni takrorlang" required minlength="6">
                        <button type="button" class="toggle-password-btn" onclick="togglePass('password_confirm')">👁️</button>
                    </div>
                </div>

                <div class="btn-row">
                    <button type="button" class="btn-cyber-submit" onclick="goToStep(2)">Keyingi Qadam →</button>
                </div>
            </div>

            <!-- 2-BOSQICH: Ta'lim, Joylashuv va Yuridik Qalqon -->
            <div class="step-content" id="step-2">
                <div class="form-grid-2">
                    <div class="input-group">
                        <label class="input-label">Viloyat</label>
                        <input type="text" id="location_region" class="cyber-input" placeholder="Toshkent">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Shahar / Tuman</label>
                        <input type="text" id="location_city" class="cyber-input" placeholder="Yunusobod">
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">Maktab / Universitet (AI reyting uchun)</label>
                    <input type="text" id="school_raw" class="cyber-input" placeholder="Masalan: 1-maktab yoki TATU">
                </div>

                <div class="form-grid-2">
                    <div class="input-group">
                        <label class="input-label">Telefon Raqam</label>
                        <input type="tel" id="tel_number" class="cyber-input" placeholder="+998901234567">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Gmail</label>
                        <input type="email" id="gmail" class="cyber-input" placeholder="user@gmail.com">
                    </div>
                </div>

                <!-- Cloudflare Turnstile -->
                <div style="display: flex; justify-content: center; margin: 14px 0;">
                    <div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}" data-theme="dark"></div>
                </div>

                <!-- Yuridik Shartlarga Rozilik -->
                <div class="terms-row">
                    <input type="checkbox" id="terms_agree" required>
                    <label for="terms_agree">
                        Men <a href="https://{{ domain }}/terms" target="_blank">Foydalanish shartlari</a> hamda 
                        <a href="https://{{ domain }}/privacy" target="_blank">Maxfiylik siyosati</a>ga to'liq roziman.
                    </label>
                </div>

                <div class="btn-row">
                    <button type="button" class="btn-cyber-back" onclick="goToStep(1)">← Orqaga</button>
                    <button type="submit" class="btn-cyber-submit" id="submit-btn">Hisobni Yaratish ✦</button>
                </div>
            </div>

        </form>

        <!-- Ijtimoiy Tarmoqlar orqali -->
        <div class="social-divider">
            <span>YOKI TEZKOR KIRISH</span>
        </div>

        <div class="oauth-cluster">
            <a href="https://github.com/login/oauth/authorize" class="oauth-btn">
                <span>🐙</span> GitHub
            </a>
            <a href="https://t.me/sstudiouz_bot" class="oauth-btn">
                <span>✈️</span> Telegram Bot
            </a>
        </div>

        <div class="auth-footer">
            Hisobingiz bormi? <a href="/login">Kirish (Sign In)</a>
        </div>
    </div>

    <script>
        function togglePass(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function goToStep(step) {
            const errorBox = document.getElementById('error-alert');
            errorBox.style.display = 'none';

            if (step === 2) {
                const name = document.getElementById('name').value.trim();
                const surname = document.getElementById('surname').value.trim();
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                const password_confirm = document.getElementById('password_confirm').value;

                if (!name || !surname || !username || !password) {
                    errorBox.textContent = "Iltimos, barcha majburiy maydonlarni to'ldiring!";
                    errorBox.style.display = 'block';
                    return;
                }

                if (password.length < 6) {
                    errorBox.textContent = "Parol kamida 6 ta belgidan iborat bo'lishi kerak!";
                    errorBox.style.display = 'block';
                    return;
                }

                if (password !== password_confirm) {
                    errorBox.textContent = "Kiritilgan parollar bir-biriga mos kelmadi!";
                    errorBox.style.display = 'block';
                    return;
                }
            }

            document.getElementById('step-1').classList.toggle('active', step === 1);
            document.getElementById('step-2').classList.toggle('active', step === 2);
            document.getElementById('step-pill-1').classList.toggle('active', step === 1);
            document.getElementById('step-pill-2').classList.toggle('active', step === 2);
        }

        document.getElementById('cyber-reg-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const errorBox = document.getElementById('error-alert');
            const submitBtn = document.getElementById('submit-btn');
            errorBox.style.display = 'none';

            if (!document.getElementById('terms_agree').checked) {
                errorBox.textContent = "Foydalanish shartlari va Maxfiylik siyosatiga rozilik bildirishingiz shart!";
                errorBox.style.display = 'block';
                return;
            }

            const turnstileResponse = document.querySelector('[name="cf-turnstile-response"]')?.value || "TEST_DEV";

            const payload = {
                name: document.getElementById('name').value.trim(),
                surname: document.getElementById('surname').value.trim(),
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value,
                location_region: document.getElementById('location_region').value.trim() || null,
                location_city: document.getElementById('location_city').value.trim() || null,
                school_raw: document.getElementById('school_raw').value.trim() || null,
                tel_number: document.getElementById('tel_number').value.trim() || null,
                gmail: document.getElementById('gmail').value.trim() || null,
                cf_turnstile_response: turnstileResponse
            };

            submitBtn.disabled = true;
            submitBtn.textContent = "Kiber-Profil Yaratilmoqda...";

            try {
                const res = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                if (res.ok) {
                    window.location.href = data.redirect || 'https://{{ domain }}';
                } else {
                    errorBox.textContent = data.detail || "Ro'yxatdan o'tishda xatolik yuz berdi.";
                    errorBox.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Hisobni Yaratish ✦";
                }
            } catch (err) {
                errorBox.textContent = "Server bilan bog'lanishda xatolik. Qaytadan urinib ko'ring.";
                errorBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = "Hisobni Yaratish ✦";
            }
        });
    </script>
</body>
</html>
