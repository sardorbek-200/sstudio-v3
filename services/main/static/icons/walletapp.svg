<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="wallet-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B2CBF" />
      <stop offset="50%" stop-color="#5A00C6" />
      <stop offset="100%" stop-color="#3C096C" />
    </linearGradient>
    <linearGradient id="card-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="coin-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Rounded Card -->
  <rect x="10" y="10" width="180" height="180" rx="45" fill="url(#wallet-bg)" filter="url(#shadow)" />
  <rect x="10" y="10" width="180" height="180" rx="45" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Wallet Body -->
  <rect x="35" y="65" width="130" height="90" rx="16" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2.5" />
  
  <!-- Credit Card Sticking Out -->
  <rect x="48" y="45" width="104" height="60" rx="10" fill="url(#card-glow)" opacity="0.9" filter="url(#shadow)"/>
  <line x1="48" y1="58" x2="152" y2="58" stroke="#111827" stroke-width="8" opacity="0.7"/>
  <circle cx="65" cy="82" r="6" fill="#FF5F56"/>
  <circle cx="75" cy="82" r="6" fill="#FFBD2E" opacity="0.8"/>

  <!-- Front Wallet Flap -->
  <path d="M 35 85 L 165 85 L 165 140 C 165 149 157 155 148 155 L 52 155 C 43 155 35 149 35 140 Z" fill="#4C0099" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>

  <!-- Wallet Clasp / Lock -->
  <rect x="125" y="102" width="40" height="26" rx="8" fill="#1A0B2E" stroke="url(#card-glow)" stroke-width="2" filter="url(#shadow)" />
  <circle cx="140" cy="115" r="5" fill="url(#coin-gold)" filter="url(#glow)"/>

  <!-- Floating sCoin Gold Icon -->
  <g transform="translate(110, 32)">
    <circle cx="20" cy="20" r="18" fill="url(#coin-gold)" stroke="#FFF" stroke-width="2" filter="url(#glow)"/>
    <text x="20" y="27" font-family="sans-serif" font-weight="900" font-size="20" fill="#3C096C" text-anchor="middle">S</text>
  </g>
</svg>
