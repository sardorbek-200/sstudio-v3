<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="cyberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#4facfe" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Space Portal -->
  <rect width="512" height="512" rx="100" fill="url(#cyberGlow)"/>
  <rect width="506" height="506" x="3" y="3" rx="98" fill="none" stroke="#00f2fe" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Cyber Grid Lines -->
  <path d="M50 256 H462 M256 50 V462" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#ff0844" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="12 6"/>

  <!-- Left Cyan Starfighter -->
  <g transform="translate(140, 256) rotate(45)" filter="url(#neonBlur)">
    <polygon points="0,-50 30,35 0,20 -30,35" fill="url(#neonCyan)"/>
    <polygon points="0,-35 15,20 0,10 -15,20" fill="#ffffff" fill-opacity="0.8"/>
    <!-- Engine Jet -->
    <polygon points="-8,25 0,45 8,25" fill="#00f2fe"/>
  </g>

  <!-- Right Red Starfighter -->
  <g transform="translate(372, 256) rotate(-135)" filter="url(#neonBlur)">
    <polygon points="0,-50 30,35 0,20 -30,35" fill="url(#neonRed)"/>
    <polygon points="0,-35 15,20 0,10 -15,20" fill="#ffffff" fill-opacity="0.8"/>
    <!-- Engine Jet -->
    <polygon points="-8,25 0,45 8,25" fill="#ff0844"/>
  </g>

  <!-- Center Laser Clash / Targeting Reticle -->
  <!-- Laser Beam Clash -->
  <line x1="160" y1="236" x2="256" y2="256" stroke="#00f2fe" stroke-width="5" stroke-linecap="round" filter="url(#neonBlur)"/>
  <line x1="352" y1="276" x2="256" y2="256" stroke="#ff0844" stroke-width="5" stroke-linecap="round" filter="url(#neonBlur)"/>

  <!-- Reticle -->
  <circle cx="256" cy="256" r="38" fill="none" stroke="#fff" stroke-width="3" filter="url(#neonBlur)"/>
  <circle cx="256" cy="256" r="6" fill="#fff"/>
  <line x1="256" y1="206" x2="256" y2="226" stroke="#fff" stroke-width="3"/>
  <line x1="256" y1="286" x2="256" y2="306" stroke="#fff" stroke-width="3"/>
  <line x1="206" y1="256" x2="226" y2="256" stroke="#fff" stroke-width="3"/>
  <line x1="286" y1="256" x2="306" y2="256" stroke="#fff" stroke-width="3"/>

  <!-- Badge Text -->
  <text x="256" y="440" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="900" font-size="34" fill="#00f2fe" letter-spacing="8" filter="url(#neonBlur)">SDUELS 3D</text>
</svg>
