<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0b36"/>
      <stop offset="50%" stop-color="#0f051d"/>
      <stop offset="100%" stop-color="#05020a"/>
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF099"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="url(#purpleGlow)" stroke-width="4" opacity="0.4"/>

  <!-- Podium / Platform -->
  <path d="M 120 390 L 392 390 L 360 430 L 152 430 Z" fill="url(#cyanGlow)" opacity="0.8" filter="url(#glow)"/>
  <rect x="140" y="380" width="232" height="12" rx="6" fill="#38BDF8"/>

  <!-- Trophy Cup Body -->
  <!-- Base -->
  <rect x="206" y="330" width="100" height="20" rx="6" fill="url(#goldGrad)"/>
  <path d="M 236 330 L 236 280 L 276 280 L 276 330 Z" fill="url(#goldGrad)"/>
  
  <!-- Main Bowl -->
  <path d="M 156 120 C 156 240, 216 270, 256 270 C 296 270, 356 240, 356 120 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  
  <!-- Handles -->
  <path d="M 160 140 C 100 140, 100 220, 175 220" fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round"/>
  <path d="M 352 140 C 412 140, 412 220, 337 220" fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round"/>

  <!-- XP Badge Star / Lightning Emblem -->
  <circle cx="256" cy="180" r="42" fill="#1E0B36" stroke="url(#goldGrad)" stroke-width="5"/>
  <path d="M 250 148 L 232 186 L 254 186 L 244 218 L 280 174 L 258 174 Z" fill="#F59E0B" filter="url(#glow)"/>

  <!-- Top Crown Stars -->
  <path d="M 256 70 L 263 88 L 282 88 L 267 100 L 272 118 L 256 106 L 240 118 L 245 100 L 230 88 L 249 88 Z" fill="#FFD700"/>
  <path d="M 180 90 L 185 102 L 198 102 L 187 110 L 191 122 L 180 114 L 169 122 L 173 110 L 162 102 L 175 102 Z" fill="#FBBF24" opacity="0.8"/>
  <path d="M 332 90 L 337 102 L 350 102 L 339 110 L 343 122 L 332 114 L 321 122 L 325 110 L 314 102 L 327 102 Z" fill="#FBBF24" opacity="0.8"/>
</svg>
